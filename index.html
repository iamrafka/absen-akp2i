<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi HUT AKP2I ke-11</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { akp2i: { DEFAULT: '#00923f', dark: '#007532', light: '#e6f4ed' } }, fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
  <div class="flex h-screen overflow-hidden">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 w-64 flex-shrink-0 hidden md:flex flex-col">
      <div class="h-16 flex items-center px-6 border-b border-gray-100">
        <span class="font-bold text-lg text-gray-900"><i class="fa-solid fa-calendar-check text-akp2i mr-2"></i> HUT AKP2I ke-11</span>
      </div>
      <nav class="p-4 space-y-1.5 flex-1">
        <a href="#" onclick="switchTab('dashboard')" id="nav-dashboard" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-akp2i text-white"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
        <a href="#" onclick="switchTab('scanner')" id="nav-scanner" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-qrcode w-5"></i><span>Scan QR Code</span></a>
        <a href="#" onclick="switchTab('generator')" id="nav-generator" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-barcode w-5"></i><span>Generator QR</span></a>
      </nav>
    </aside>
    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6">
        <h1 id="page-title" class="text-lg font-bold text-gray-800">Dashboard & Data Absensi</h1>
        <span class="px-3 py-1 rounded-full text-xs font-medium bg-akp2i-light text-akp2i">Live Cloudflare + GAS API</span>
      </header>
      <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
        <!-- TAB DASHBOARD -->
        <section id="tab-dashboard" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
              <p class="text-sm text-gray-500">Total Peserta</p><h3 id="stat-total" class="text-2xl font-bold text-gray-800 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
              <p class="text-sm text-gray-500">Hadir</p><h3 id="stat-hadir" class="text-2xl font-bold text-akp2i mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
              <p class="text-sm text-gray-500">Belum Hadir</p><h3 id="stat-belum" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
            </div>
          </div>
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden p-5">
            <button onclick="loadTableData()" class="mb-4 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl"><i class="fa-solid fa-rotate mr-2"></i> Refresh Data</button>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-gray-50 text-gray-500 text-xs uppercase font-semibold border-b">
                    <th class="py-3 px-6">Nama</th><th class="py-3 px-6">No Anggota</th><th class="py-3 px-6">Cabang</th><th class="py-3 px-6">Status</th><th class="py-3 px-6 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="table-body" class="divide-y text-sm"></tbody>
              </table>
            </div>
          </div>
        </section>
        <!-- TAB SCANNER -->
        <section id="tab-scanner" class="hidden space-y-6">
          <div class="max-w-xl mx-auto bg-white rounded-2xl border p-6 text-center shadow-sm">
            <h3 class="text-lg font-bold mb-4">Scan QR Kehadiran</h3>
            <div id="reader" class="w-full rounded-xl overflow-hidden border bg-black mb-4"></div>
            <div id="scan-result-container" class="hidden p-4 rounded-xl bg-akp2i-light text-left">
              <h4 id="res-nama" class="font-bold text-gray-900 text-lg"></h4>
              <p class="text-xs text-gray-600 mt-1">Cabang: <span id="res-cabang" class="font-semibold"></span></p>
              <button onclick="resetScanner()" class="mt-4 w-full py-2 bg-akp2i text-white rounded-xl text-sm font-semibold">Scan Lagi</button>
            </div>
          </div>
        </section>
        <!-- TAB GENERATOR -->
        <section id="tab-generator" class="hidden space-y-6">
          <div class="max-w-xl mx-auto bg-white rounded-2xl border p-6 shadow-sm">
            <h3 class="text-lg font-bold mb-4">Tambah Data & Buat QR</h3>
            <form id="addForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
              <input type="text" id="add-nama" placeholder="Nama Lengkap" required class="w-full px-4 py-2 border rounded-xl text-sm">
              <input type="text" id="add-no" placeholder="Nomor Anggota" required class="w-full px-4 py-2 border rounded-xl text-sm">
              <select id="add-jenis" class="w-full px-4 py-2 border rounded-xl text-sm bg-white"><option value="Utama">Utama</option><option value="Madya">Madya</option></select>
              <input type="text" id="add-cabang" placeholder="Cabang" required class="w-full px-4 py-2 border rounded-xl text-sm">
              <button type="submit" class="w-full py-3 bg-akp2i text-white rounded-xl font-semibold text-sm">Simpan & Generate</button>
            </form>
            <div id="qr-output-box" class="hidden mt-4 text-center">
              <div id="qrcode" class="flex justify-center mb-2"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script>
    // Ganti URL di bawah ini dengan Web App URL Google Apps Script Anda yang berakhiran /exec
    const API_URL = "https://script.google.com/macros/s/AKfycby0Cp_xFHBlyi_h3DlQ_CQqLRIM7Pdc8l5E5iXeX5MgcpgNz4-LXc38fQaZPSQ4EkmvbA/exec";

    let allData = [];
    let html5QrCode = null;

    function switchTab(tabId) {
      ['dashboard', 'scanner', 'generator'].forEach(id => {
        document.getElementById('tab-' + id).classList.add('hidden');
        document.getElementById('nav-' + id).className = "flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50";
      });
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.getElementById('nav-' + tabId).className = "flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-akp2i text-white";
      if(tabId === 'scanner') initScanner(); else stopScanner();
    }

    function loadTableData() {
      fetch(API_URL + "?action=getStats")
        .then(res => res.json())
        .then(res => {
          allData = res.data;
          document.getElementById('stat-total').innerText = res.total;
          document.getElementById('stat-hadir').innerText = res.hadir;
          document.getElementById('stat-belum').innerText = res.belum;
          renderTable(allData);
        });
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      if(data.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-gray-400">Belum ada data.</td></tr>`; return; }
      data.forEach(item => {
        tbody.innerHTML += `<tr class="hover:bg-gray-50"><td class="py-3 px-6 font-medium">${item.nama}</td><td class="py-3 px-6">${item.noAnggota}</td><td class="py-3 px-6">${item.cabang}</td><td class="py-3 px-6"><span class="px-2 py-1 rounded-full text-xs font-semibold ${item.status==='Hadir'?'bg-akp2i-light text-akp2i':'bg-gray-100'}">${item.status}</span></td><td class="py-3 px-6 text-center"><button onclick="deleteData(${item.rowId})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td></tr>`;
      });
    }

    function initScanner() {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess, () => {}).catch(e => alert("Gagal akses kamera. Pastikan menggunakan browser/izin aktif."));
    }

    function stopScanner() { if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop(); }

    function onScanSuccess(text) {
      stopScanner();
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "scan", qrText: text }) })
        .then(res => res.json())
        .then(res => {
          if(res.success) {
            document.getElementById('res-nama').innerText = res.data.nama;
            document.getElementById('res-cabang').innerText = res.data.cabang;
            document.getElementById('scan-result-container').classList.remove('hidden');
            loadTableData();
          } else { alert(res.message); resetScanner(); }
        });
    }

    function resetScanner() { document.getElementById('scan-result-container').classList.add('hidden'); initScanner(); }

    function handleFormSubmit(e) {
      e.preventDefault();
      const formData = {
        nama: document.getElementById('add-nama').value,
        noAnggota: document.getElementById('add-no').value,
        jenisAnggota: document.getElementById('add-jenis').value,
        cabang: document.getElementById('add-cabang').value,
        keterangan: "Lunas"
      };
      fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "add", formData: formData }) })
        .then(res => res.json())
        .then(res => {
          alert(res.message);
          document.getElementById('addForm').reset();
          document.getElementById('qrcode').innerHTML = "";
          new QRCode(document.getElementById("qrcode"), { text: res.id, width: 150, height: 150 });
          document.getElementById('qr-output-box').classList.remove('hidden');
          loadTableData();
        });
    }

    function deleteData(rowId) {
      if(confirm("Hapus data?")) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "delete", rowId: rowId }) })
          .then(res => res.json())
          .then(res => { alert(res.message); loadTableData(); });
      }
    }

    window.onload = loadTableData;
  </script>
</body>
</html>
